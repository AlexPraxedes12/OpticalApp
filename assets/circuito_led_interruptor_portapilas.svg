<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .wire { fill: none; stroke: #111827; stroke-width: 4; }
      .label { font: 600 20px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif; fill: #111827; }
      .sub { font: 16px system-ui, sans-serif; fill: #374151; }
      .title { font: 700 28px system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <text x="600" y="48" text-anchor="middle" class="title">Esquema: LED + Interruptor + Portapilas (con resistencia opcional)</text>

  <!-- Battery -->
  <g transform="translate(900,300)">
    <line x1="-40" y1="0" x2="-10" y2="0" stroke="#111827" stroke-width="6"/>
    <line x1="10" y1="0" x2="60" y2="0" stroke="#111827" stroke-width="12"/>
    <circle cx="-55" cy="0" r="6" fill="#111827"/>
    <circle cx="75" cy="0" r="6" fill="#111827"/>
    <text x="0" y="-30" text-anchor="middle" class="label">Portapilas</text>
    <text x="75" y="30" text-anchor="middle" class="sub">+ positivo</text>
    <text x="-55" y="30" text-anchor="middle" class="sub">− negativo</text>
  </g>

  <!-- Switch -->
  <g transform="translate(600,150)">
    <circle cx="0" cy="0" r="6" fill="#111827"/>
    <line x1="0" y1="0" x2="60" y2="-25" class="wire"/>
    <circle cx="80" cy="-25" r="6" fill="#111827"/>
    <text x="40" y="-55" text-anchor="middle" class="label">Interruptor</text>
  </g>

  <!-- LED -->
  <g transform="translate(250,350)">
    <polygon points="0,-25 0,25 35,0" fill="none" stroke="#111827" stroke-width="4"/>
    <line x1="35" y1="-25" x2="35" y2="25" class="wire"/>
    <circle cx="-25" cy="0" r="6" fill="#111827"/>
    <circle cx="60" cy="0" r="6" fill="#111827"/>
    <line x1="70" y1="-10" x2="100" y2="-30" class="wire" marker-end="url(#arrow)"/>
    <line x1="70" y1="10" x2="100" y2="30" class="wire" marker-end="url(#arrow)"/>
    <text x="85" y="-55" text-anchor="start" class="label">LED</text>
    <text x="-25" y="30" text-anchor="middle" class="sub">ánodo (+)</text>
    <text x="60"  y="30" text-anchor="middle" class="sub">cátodo (−)</text>
  </g>

  <!-- Resistor (optional) -->
  <g transform="translate(400,200)">
    <rect x="0" y="0" width="120" height="40" rx="6" ry="6" fill="none" stroke="#111827" stroke-width="4"/>
    <text x="60" y="28" text-anchor="middle" class="label">Resistencia</text>
    <text x="60" y="-10" text-anchor="middle" class="sub">opcional (serie)</text>
  </g>

  <!-- Wires -->
  <path class="wire" d="M 225 350 L 225 220 L 400 220" />
  <path class="wire" d="M 520 220 L 600 220 L 680 125 L 900 125 L 900 300" />
  <path class="wire" d="M 975 300 L 975 500 L 310 500 L 310 350" />

  <!-- Notes -->
  <g transform="translate(140,600)">
    <text class="sub">
      <tspan x="0" dy="0">Cálculo de resistencia (si se usa): R = (Vbat − Vf_LED) / I_LED. Ej.: 3.0V, Vf≈2.8V, I≈20mA → R≈10Ω.</tspan>
      <tspan x="0" dy="24">Polaridad del LED: ánodo al lado del interruptor/positivo, cátodo al negativo.</tspan>
    </text>
  </g>
</svg>
